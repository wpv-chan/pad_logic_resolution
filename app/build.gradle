plugins { id 'com.android.application' }

android {
    namespace 'com.padtools.display'
    compileSdk 36
    defaultConfig {
        applicationId 'com.padtools.display'
        minSdk 30
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging {
        resources.excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
    lint { abortOnError true }
    testOptions {
        unitTests.all {
            if (project.hasProperty('padTestShell')) systemProperty 'pad.test.shell', project.property('padTestShell')
        }
    }
}

dependencies {
    implementation project(':adb-lib')
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    testImplementation 'junit:junit:4.13.2'
}
